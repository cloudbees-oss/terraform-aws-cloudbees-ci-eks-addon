unclassified:
  globalDefaultFlowDurabilityLevel:
    durabilityHint: PERFORMANCE_OPTIMIZED
  globalLibraries:
    libraries:
    - defaultVersion: ${cbci_casc_branch}
      name: "common"
      retriever:
        modernSCM:
          libraryPath: ${cbci_casc_path_shared_library}
          scm:
            git:
              remote: ${cbci_casc_repo_url}
      cachingConfiguration:
        refreshTimeMinutes: 0
