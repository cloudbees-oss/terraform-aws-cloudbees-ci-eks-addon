unclassified:
  globalDefaultFlowDurabilityLevel:
    durabilityHint: MAX_SURVIVABILITY
  globalLibraries:
    libraries:
    - defaultVersion: ${cbci_casc_branch}
      name: "common"
      retriever:
        modernSCM:
          clone: true
          libraryPath: ${cbci_casc_path_shared_library}
          scm:
            git:
              remote: ${cbci_casc_repo_url}
              traits:
              - cloneOption:
                  extension:
                    depth: 1
                    noTags: false
                    shallow: true
cloudbees-pipeline-policies:
  config:
    policies:
    - action: "warning"
      customMessage: "Use steps compatible with HA/HS controllers"
      name: "HA - Controllers"
      rules:
      - "hARule"
