OperationsCenter:
  NodeSelector:
    role: ${cbciAppsNodeRole}
  Tolerations:
    - key: ${cbciAppsTolerationKey}
      operator: Equal
      value: ${cbciAppsTolerationValue}
      effect: NoSchedule
  CasC:
    Enabled: true
    Retriever:
      Enabled: true
      ocBundleAutomaticVersion: true
      scmRepo: ${cbciScmRepoUrl}
      scmBranch: ${cbciScmBranch}
      scmBundlePath: ${cbciScmBundlePath}
      scmPollingInterval: ${cbciScmPollingInterval}
Persistence:
  StorageClass: efs
Hibernation:
  Enabled: true
  NodeSelector:
    role: ${cbciAppsNodeRole}
  Tolerations:
    - key: ${cbciAppsTolerationKey}
      operator: Equal
      value: ${cbciAppsTolerationValue}
      effect: NoSchedule
Agents:
  SeparateNamespace:
    Enabled: true
    Create: true
    Name: ${cbciAgentsNamespace}
